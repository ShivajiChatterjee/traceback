[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceback-rca"
version = "0.1.0"
description = "Verification-first root-cause analysis for production LLM/RAG systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
